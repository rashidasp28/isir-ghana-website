<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1272" role="img" aria-labelledby="title desc">
  <title id="title">Brick STEAM Discovery Caravan expands to two new girls schools in Tamale</title>
  <desc id="desc">Flyer for ISIR Ghana and GEM-GHANA Brick STEAM Discovery Caravan outreach at Zosimli Girls Junior High School and Tamale Metro Girls Model JHS on 24 June 2026.</desc>
